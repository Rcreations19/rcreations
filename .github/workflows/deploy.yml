name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Push secrets to Cloudflare Worker
        run: |
          set -e
          # wrangler secret put is idempotent — creates if missing, updates if present
          # Use printf '%s' instead of echo to avoid trailing newline in secret value
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "${{ secrets.ADMIN_EMAIL }}" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "${{ secrets.ADMIN_PASSWORD_HASH }}" | npx wrangler secret put ADMIN_PASSWORD_HASH
          printf '%s' "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "${{ secrets.GOOGLE_PLACES_API_KEY }}" | npx wrangler secret put GOOGLE_PLACES_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify Worker Secrets Deployed
        run: |
          set -e
          # Verify all 5 required secrets exist in Worker via wrangler CLI (JSON output)
          echo "Fetching secret list from Worker..."
          SECRETS_JSON=$(npx wrangler secret list --format json 2>/dev/null)
          
          REQUIRED_SECRETS=("SUPABASE_SERVICE_ROLE_KEY" "ADMIN_EMAIL" "ADMIN_PASSWORD_HASH" "RESEND_API_KEY" "GOOGLE_PLACES_API_KEY")
          MISSING=()
          
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if ! echo "$SECRETS_JSON" | jq -e --arg name "$secret" 'map(.name) | index($name)' >/dev/null; then
              MISSING+=("$secret")
            fi
          done
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing secrets in Worker: ${MISSING[*]}"
            echo "Full secret list:"
            echo "$SECRETS_JSON" | jq '.[] | {name, type}'
            exit 1
          fi
          
          echo "✅ All ${#REQUIRED_SECRETS[@]} required secrets present in Worker"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
